<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#FFCC00">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@700&family=Nunito:wght@400;600;800&family=Press+Start+2P&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1792432343">
<title>Play the demo early | Language Adventure</title>
<meta name="description" content="Ask to play the Language Adventure demo early. No forms to fill in, just send an email.">
</head>
<body>

<header class="top">
  <div class="hero-banner">
    <img class="bg" src="img/banner.jpg" alt="" width="1800" height="439">
    <a class="logo" href="index.html"><img src="img/logo.png" alt="Language Adventure" width="1080" height="461"></a>
  </div>
  <nav class="flags" id="flags" aria-label="Language"></nav>
</header>

<div class="layout">
<aside class="side" data-photos="13,4" aria-hidden="true"></aside>
<main>
  <p class="back"><a class="back-btn" href="index.html" aria-label="Back" title="Back"><img class="b1" src="img/back-1.png" alt="" width="64" height="64"><img class="b2" src="img/back-2.png" alt="" width="64" height="64"></a></p>
  <h1 class="page-title" data-i18n="demoTitle">Play the demo early!</h1>
  <p data-i18n="demoP1"></p>
  <p data-i18n="demoP2"></p>

  <form id="demo-form" class="demo-form" action="#" method="post">
    <label class="fld"><span data-i18n="fEmail">Your email address (so I know where to send the demo)</span>
      <input type="email" name="email" required autocomplete="email"></label>
    <label class="fld"><span><span data-i18n="fName">Name</span> <em data-i18n="optional">(optional)</em></span>
      <input type="text" name="name" autocomplete="name"></label>
    <label class="fld"><span><span data-i18n="fLangs">Languages I speak</span> <em data-i18n="optional">(optional)</em></span>
      <input type="text" name="languages_spoken"></label>
    <label class="fld"><span><span data-i18n="fSub">Subtitle language I'd like to use</span> <em data-i18n="optional">(optional)</em></span>
      <input type="text" name="subtitle_language"></label>
    <label class="fld"><span><span data-i18n="fLevel">My English level</span> <em data-i18n="optional">(optional)</em></span>
      <select name="english_level">
        <option value="" data-i18n="choose">Choose…</option>
        <option value="Beginner" data-i18n="lvl1">Beginner</option>
        <option value="Intermediate" data-i18n="lvl2">Intermediate</option>
        <option value="Advanced" data-i18n="lvl3">Advanced</option>
        <option value="Not sure" data-i18n="lvl4">Not sure</option>
      </select></label>
    <label class="fld"><span><span data-i18n="fComputer">My computer</span> <em data-i18n="optional">(optional)</em></span>
      <select name="computer">
        <option value="" data-i18n="choose">Choose…</option>
        <option value="Windows">Windows</option>
        <option value="Mac">Mac</option>
        <option value="Linux">Linux</option>
        <option value="Other" data-i18n="osOther">Other</option>
      </select></label>
    <label class="fld"><span><span data-i18n="fFeedback">Happy to send feedback and report mistakes?</span> <em data-i18n="optional">(optional)</em></span>
      <select name="happy_to_give_feedback">
        <option value="" data-i18n="choose">Choose…</option>
        <option value="Yes" data-i18n="yes">Yes</option>
        <option value="No" data-i18n="no">No</option>
      </select></label>
    <label class="fld"><span><span data-i18n="fExtra">Anything else you'd like to tell me</span> <em data-i18n="optional">(optional)</em></span>
      <textarea name="message" rows="4"></textarea></label>
    <input type="text" name="_honey" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
    <p class="center"><button class="btn" type="submit" data-i18n="demoBtn">Send my request</button></p>
  </form>
  <p id="form-status" class="note" role="status" aria-live="polite"></p>
</main>
<aside class="side" data-photos="14,5" aria-hidden="true"></aside>
</div>

<footer id="contact">
  <h2 data-i18n="contactTitle">Contact</h2>
  <p data-i18n="contactText"></p>
  <p><a href="mailto:gameswonky@gmail.com"><strong>gameswonky@gmail.com</strong></a></p>
  <ul class="social" aria-label="Links">
    <li><a href="mailto:gameswonky@gmail.com" aria-label="Email" title="Email"><img src="img/letter.png" alt="" width="64" height="64"></a></li>
    <li><a href="https://www.patreon.com/c/LanguageAdventureEnglish" target="_blank" rel="noopener" aria-label="Patreon" title="Patreon"><img src="img/social/patreon.png" alt="" width="32" height="32"></a></li>
    <li><a href="https://ko-fi.com/languageadventure" target="_blank" rel="noopener" aria-label="Ko-fi" title="Ko-fi"><img src="img/social/kofi-cup.png" alt="" width="32" height="32"></a></li>
    <li><a href="https://www.instagram.com/wonky_games/" target="_blank" rel="noopener" aria-label="Instagram" title="Instagram"><img src="img/social/instagram.png" alt="" width="32" height="32"></a></li>
    <li><a href="https://bsky.app/profile/languageadventure.bsky.social" target="_blank" rel="noopener" aria-label="Bluesky" title="Bluesky"><img src="img/social/bluesky.svg" alt="" width="32" height="32"></a></li>
    <li><a href="https://www.reddit.com/r/LanguageAdventure/" target="_blank" rel="noopener" aria-label="Reddit" title="Reddit"><img src="img/social/reddit.svg" alt="" width="32" height="32"></a></li>
  </ul>
</footer>

</body>
</html>
